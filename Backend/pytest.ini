[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short

# SQLAlchemy 2.x signale Query.get() comme legacy et Flask/Celery emettent
# quelques avertissements de depreciation : le code applicatif existant les
# declenche, ce n'est pas le role des tests de les traiter.
# LegacyAPIWarning derive de DeprecationWarning, le filtre ci-dessous suffit.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
